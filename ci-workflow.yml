name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: pip install pylint flake8 bandit pytest

    - name: Lint (Pylint)
      run: pylint **/*.py || true

    - name: Style Check (Flake8)
      run: flake8 || true

    - name: Security Scan (Bandit)
      run: bandit -r . || true

    - name: Unit Tests
      run: pytest || true
